<div id="worldtime-app" style="max-width: 900px; font-family: Arial;">

  <div style="display:flex; justify-content:space-between; align-items:center;">
    <h3 style="margin:0;">World Time Timeline — Based on Montreal</h3>
    <button id="darkToggle" style="padding:6px 12px; border-radius:6px; border:1px solid #888; cursor:pointer;">
      Dark Mode
    </button>
  </div>

  <div id="slider-container" style="margin:20px 0;">
    <input type="range" id="timeSlider" min="0" max="1440" value="0" style="width:100%;">
  </div>

  <div id="timeline-container"></div>

</div>

<style>
  #worldtime-app {
    padding: 10px 0;
  }

  #worldtime-app.dark {
    background:#1e1e1e;
    color:#eee;
    padding:20px;
    border-radius:10px;
  }

  /* Slider styling */
  #timeSlider {
    -webkit-appearance: none;
    width: 100%;
    height: 6px;
    border-radius: 3px;
    background: linear-gradient(90deg, #123055, #cfe4ff);
    outline: none;
  }
  #timeSlider::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: #ffffff;
    border: 2px solid #123055;
    cursor: pointer;
  }
  #timeSlider::-moz-range-thumb {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: #ffffff;
    border: 2px solid #123055;
    cursor: pointer;
  }

  #worldtime-app.dark #timeSlider {
    background: linear-gradient(90deg, #0b1b33, #9fbfe8);
  }
  #worldtime-app.dark #timeSlider::-webkit-slider-thumb,
  #worldtime-app.dark #timeSlider::-moz-range-thumb {
    border-color:#9fbfe8;
  }

  .city-row {
    margin-bottom: 40px;
  }

  .city-header {
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:4px;
  }

  .city-name {
    font-weight:bold;
    display:flex;
    align-items:center;
    gap:8px;
  }

  .city-date {
    color:#666;
    font-size:0.9em;
  }

  #worldtime-app.dark .city-date {
    color:#ccc;
  }

  .city-datetime {
    font-size:0.9em;
    margin-bottom:4px;
  }

  .timeline-bar {
    position:relative;
    height:48px;          /* increased to make room for labels */
    border-radius:6px;
    overflow:visible;     /* allow labels below the bar */
    background:transparent;
  }

  .shade-day {
    background:#cfe4ff;
    position:absolute;
    height:32px;
    top:0;
  }
  .shade-night {
    background:#123055;
    position:absolute;
    height:32px;
    top:0;
  }

  #worldtime-app.dark .shade-day {
    background:#9fbfe8;
  }
  #worldtime-app.dark .shade-night {
    background:#0b1b33;
  }

  .time-marker {
    position:absolute;
    top:0;
    width:2px;
    height:32px;
    background:#ff3b30;
    z-index:3;
  }

  .tick-major,
  .tick-minor {
    position:absolute;
    width:1px;
    background:rgba(0,0,0,0.35);
    z-index:2;
  }

  .tick-major {
    height:32px;
    top:0;
  }

  .tick-minor {
    height:16px;
    top:8px;
  }

  #worldtime-app.dark .tick-major,
  #worldtime-app.dark .tick-minor {
    background:rgba(255,255,255,0.4);
  }

  /* Hour labels under the bar */
  .hour-label {
    position: absolute;
    top: 34px;            /* just under the 32px bar */
    transform: translateX(-50%);
    font-size: 10px;
    color: #666;
    white-space: nowrap;
  }

  #worldtime-app.dark .hour-label {
    color:#bbb;
  }
</style>

<script>
  const cities = [
    { name: "Montreal, Canada", tz: "America/Toronto", flag: "ca" },
    { name: "Guangzhou, China", tz: "Asia/Shanghai", flag: "cn" },
    { name: "Melbourne, Australia", tz: "Australia/Melbourne", flag: "au" },
    { name: "Stuttgart, Germany", tz: "Europe/Berlin", flag: "de" },
    { name: "Phoenix, Arizona", tz: "America/Phoenix", flag: "us" }
  ];

  const container = document.getElementById("timeline-container");
  const slider = document.getElementById("timeSlider");
  const app = document.getElementById("worldtime-app");

  let userDragging = false;
  let lastDragTime = 0;

  function renderTimelines() {
    container.innerHTML = "";

    cities.forEach(city => {
      const row = document.createElement("div");
      row.className = "city-row";

      const tzId = city.tz.replace(/\//g, '_');

      row.innerHTML = `
        <div class="city-header">
          <div class="city-name" id="name-${tzId}">
            <img src="https://flagcdn.com/24x18/${city.flag}.png">
            ${city.name}
          </div>
          <div class="city-date" id="date-${tzId}"></div>
        </div>

        <div class="city-datetime" id="dt-${tzId}"></div>

        <div class="timeline-bar" id="bar-${tzId}"></div>
      `;

      container.appendChild(row);
    });
  }

  renderTimelines();

  function approximateSunTimes(lat) {
    return { sunrise: 6, sunset: 18 };
  }

  const cityLat = {
    "America/Toronto": 45.5,
    "Asia/Shanghai": 23.1,
    "Australia/Melbourne": -37.8,
    "Europe/Berlin": 48.8,
    "America/Phoenix": 33.4
  };

  function getTZLabels(date, tz) {
    const shortFmt = new Intl.DateTimeFormat("en-US", {
      timeZone: tz,
      timeZoneName: "short"
    });
    const longFmt = new Intl.DateTimeFormat("en-US", {
      timeZone: tz,
      timeZoneName: "long"
    });

    const short = shortFmt.formatToParts(date).find(p => p.type === "timeZoneName")?.value || "";
    const long = longFmt.formatToParts(date).find(p => p.type === "timeZoneName")?.value || "";

    return { short, long };
  }

  function updateTimelines() {
    const minutes = parseInt(slider.value, 10);
    const montrealNow = new Date().toLocaleString("en-US", { timeZone: "America/Toronto" });
    const montrealBase = new Date(montrealNow);
    montrealBase.setHours(0, minutes, 0, 0);

    cities.forEach(city => {
      const tzId = city.tz.replace(/\//g, '_');
      const local = new Date(montrealBase.toLocaleString("en-US", { timeZone: city.tz }));
      const hours = local.getHours() + local.getMinutes() / 60;

      const bar = document.getElementById(`bar-${tzId}`);
      bar.innerHTML = "";

      const { sunrise, sunset } = approximateSunTimes(cityLat[city.tz]);
      const dayStart = (sunrise / 24) * 100;
      const dayEnd = (sunset / 24) * 100;

      const night1 = document.createElement("div");
      night1.className = "shade-night";
      night1.style.left = "0%";
      night1.style.width = dayStart + "%";

      const day = document.createElement("div");
      day.className = "shade-day";
      day.style.left = dayStart + "%";
      day.style.width = (dayEnd - dayStart) + "%";

      const night2 = document.createElement("div");
      night2.className = "shade-night";
      night2.style.left = dayEnd + "%";
      night2.style.width = (100 - dayEnd) + "%";

      bar.appendChild(night1);
      bar.appendChild(day);
      bar.appendChild(night2);

      // Hour ticks
      for (let h = 0; h <= 24; h++) {
        const left = (h / 24) * 100;
        const tick = document.createElement("div");
        tick.className = (h % 3 === 0) ? "tick-major" : "tick-minor";
        tick.style.left = left + "%";
        bar.appendChild(tick);
      }

      // Hour labels every 3 hours
      for (let h = 0; h <= 24; h += 3) {
        const left = (h / 24) * 100;
        const label = document.createElement("div");
        label.className = "hour-label";
        label.style.left = left + "%";
        label.textContent = String(h).padStart(2, "0") + ":00";
        bar.appendChild(label);
      }

      const marker = document.createElement("div");
      marker.className = "time-marker";
      marker.style.left = (hours / 24) * 100 + "%";
      bar.appendChild(marker);

      const dateStr = local.toLocaleDateString("en-US", {
        weekday: "short",
        month: "short",
        day: "2-digit"
      });
      document.getElementById(`date-${tzId}`).textContent = dateStr;

      const dtStr = local.toLocaleString("en-US", {
        weekday: "long",
        month: "short",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit",
        hour12: false
      });
      document.getElementById(`dt-${tzId}`).textContent = dtStr;

      const { short, long } = getTZLabels(local, city.tz);
      const nameEl = document.getElementById(`name-${tzId}`);
      nameEl.innerHTML = `
        <img src="https://flagcdn.com/24x18/${city.flag}.png">
        ${city.name} (${short} - ${long})
      `;
    });
  }

  slider.addEventListener("input", () => {
    userDragging = true;
    lastDragTime = Date.now();
    updateTimelines();
  });

  function animateSliderTo(target) {
    const current = parseInt(slider.value, 10);
    const steps = 20;
    const step = (target - current) / steps;
    let frame = 0;

    const anim = setInterval(() => {
      frame++;
      slider.value = current + step * frame;
      updateTimelines();
      if (frame >= steps) clearInterval(anim);
    }, 20);
  }

  setInterval(() => {
    if (userDragging && Date.now() - lastDragTime < 10000) return;

    userDragging = false;

    const now = new Date().toLocaleString("en-US", { timeZone: "America/Toronto" });
    const d = new Date(now);
    const minutes = d.getHours() * 60 + d.getMinutes();

    animateSliderTo(minutes);
  }, 1000);

  updateTimelines();

  document.getElementById("darkToggle").onclick = () => {
    app.classList.toggle("dark");
  };
</script>
