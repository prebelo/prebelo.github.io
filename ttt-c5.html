<div id="worldtime-app" style="max-width: 900px; font-family: Arial;">

  <div style="display:flex; justify-content:space-between; align-items:center;">
    <h3 style="margin:0;">World Time Timeline — Based on Montreal</h3>
    <button id="darkToggle" style="padding:6px 12px; border-radius:6px; border:1px solid #888; cursor:pointer;">
      Dark Mode
    </button>
  </div>

  <div id="slider-container" style="margin:20px 0;">
    <input type="range" id="timeSlider" min="0" max="1440" value="0" style="width:100%;">
    <div id="current-time-label" style="
      text-align:center;
      margin-top:8px;
      font-size:14px;
      font-weight:bold;
      color:#444;
    "></div>
  </div>

  <div id="timeline-container"></div>

</div>

<style>
  #worldtime-app {
    padding: 10px 0;
  }

  #worldtime-app.dark {
    background:#1e1e1e;
    color:#eee;
    padding:20px;
    border-radius:10px;
  }

  /* Slider styling */
  #timeSlider {
    -webkit-appearance: none;
    width: 100%;
    height: 6px;
    border-radius: 3px;
    background: linear-gradient(90deg, #123055, #cfe4ff);
    outline: none;
  }
  #timeSlider::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: #ffffff;
    border: 2px solid #123055;
    cursor: pointer;
  }
  #timeSlider::-moz-range-thumb {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: #ffffff;
    border: 2px solid #123055;
    cursor: pointer;
  }

  #worldtime-app.dark #timeSlider {
    background: linear-gradient(90deg, #0b1b33, #9fbfe8);
  }
  #worldtime-app.dark #timeSlider::-webkit-slider-thumb,
  #worldtime-app.dark #timeSlider::-moz-range-thumb {
    border-color:#9fbfe8;
  }

  .city-row {
    margin-bottom: 40px;
  }

  .city-header {
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:4px;
  }

  .city-name {
    font-weight:bold;
    display:flex;
    align-items:center;
    gap:8px;
  }

  .city-date {
    color:#666;
    font-size:0.9em;
  }

  #worldtime-app.dark .city-date {
    color:#ccc;
  }

  .city-datetime {
    font-size:0.9em;
    margin-bottom:4px;
  }

  .timeline-bar {
    position:relative;
    height:32px;
    border-radius:6px;
    overflow:visible; /* allow labels below the bar */
    background:transparent;
  }

  .shade-day,
  .shade-night {
    position:absolute;
    top:0;
    height:100%;
  }

  .shade-day {
    background:#cfe4ff;
  }
  .shade-night {
    background:#123055;
  }

  #worldtime-app.dark .shade-day {
    background:#9fbfe8;
  }
  #worldtime-app.dark .shade-night {
    background:#0b1b33;
  }

  .time-marker {
    position:absolute;
    top:0;
    width:2px;
    height:100%;
    background:#ff3b30;
    z-index:3;
  }

  .tick-major,
  .tick-minor {
    position:absolute;
    width:1px;
    background:rgba(0,0,0,0.35);
    z-index:2;
  }

  .tick-major {
    height:100%;
    top:0;
  }

  .tick-minor {
    height:50%;
    top:25%;
  }

  #worldtime-app.dark .tick-major,
  #worldtime-app.dark .tick-minor {
    background:rgba(255,255,255,0.4);
  }

  /* Hour labels under each bar at every 3 hours */
  .hour-label {
    position: absolute;
    top: 36px; /* just under the 32px bar */
    transform: translateX(-50%);
    font-size: 10px;
    color: #666;
    white-space: nowrap;
  }

  #worldtime-app.dark .hour-label {
    color:#bbb;
  }
</style>

      `;

      container.appendChild(row);
    });
  }
