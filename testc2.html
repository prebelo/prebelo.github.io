<div style="max-width: 700px; font-family: Arial;">

  <h3 style="margin-top: 0;">World Time — Based on Montreal (Live)</h3>

  <div id="time-bars"></div>

</div>

<script>
  const zones = [
    { name: "Montreal, Canada", tz: "America/Toronto", color: "#4a90e2" },
    { name: "Guangzhou, China", tz: "Asia/Shanghai", color: "#7ed321" },
    { name: "Melbourne, Australia", tz: "Australia/Melbourne", color: "#f5a623" },
    { name: "Stuttgart, Germany", tz: "Europe/Berlin", color: "#bd10e0" },
    { name: "Phoenix, Arizona", tz: "America/Phoenix", color: "#d0021b" }
  ];

  const container = document.getElementById("time-bars");

  function renderBars() {
    container.innerHTML = "";
    zones.forEach(z => {
      container.innerHTML += `
        <div style="margin-bottom: 12px;">
          <div style="font-weight: bold; margin-bottom: 4px;">${z.name}</div>
          <div style="background: ${z.color}; padding: 10px; border-radius: 6px; color: white; font-size: 1.2em;">
            <span id="time-${z.tz.replace(/\//g, '_')}"></span>
          </div>
        </div>
      `;
    });
  }

  renderBars();

  function updateTimes() {
    // Montreal current time as the base
    const montrealNow = new Date().toLocaleString("en-US", { timeZone: "America/Toronto" });
    const baseDate = new Date(montrealNow);

    zones.forEach(z => {
      const converted = baseDate.toLocaleString("en-US", { timeZone: z.tz });
      document.getElementById(`time-${z.tz.replace(/\//g, '_')}`).innerHTML = converted;
    });
  }

  updateTimes();
  setInterval(updateTimes, 1000);
</script>
